# =============================================================================
# Kustomization — dev overlay
# =============================================================================
# Dev is lightweight: 1 replica, relaxed resource limits, debug log level.
# Apply with:
#   kubectl apply -k k8s/overlays/dev
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev runs in its own namespace so the dev and prod Argo CD Applications never
# manage the same live objects on a shared cluster. Prod keeps `greenops`
# (the namespace the monitoring stack and the agent's default config target).
namespace: greenops-dev

resources:
  - ../../base

# ── Image overrides ───────────────────────────────────────────────────────────
# In dev, use the locally-built image pulled from a local registry.
images:
  - name: greenops-demo-workload
    newTag: dev

# ── Common labels for this environment ───────────────────────────────────────
# Kept out of selectors (immutable) — this is an identifying label only.
labels:
  - pairs:
      greenops.io/env: dev
    includeSelectors: false
    includeTemplates: true

# ── Patches ──────────────────────────────────────────────────────────────────
patches:
  # 1. Replica count — GreenOps AI will modify this value via GitOps commits.
  - target:
      kind: Deployment
      name: greenops-demo-workload
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # 2. Resource limits — relaxed in dev to save cluster capacity.
  - target:
      kind: Deployment
      name: greenops-demo-workload
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"

  # 3. Config overrides — debug logging in dev.
  - target:
      kind: ConfigMap
      name: greenops-demo-workload-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: "DEBUG"
      - op: replace
        path: /data/LOG_FORMAT
        value: "pretty"

  # 4. Image pull policy — dev uses the mutable :dev tag, so always re-pull.
  - target:
      kind: Deployment
      name: greenops-demo-workload
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
