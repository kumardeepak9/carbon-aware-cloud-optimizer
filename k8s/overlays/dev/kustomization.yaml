# ===========================================
# Kustomization — dev overlay

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization


namespace: greenops-dev

resources:
  - ../../base

# ── Image overrides ───────────────────────────────────────────────────────────

images:
  - name: greenops-demo-workload
    newTag: dev

# ── Common labels for this environment ───────────────────────────────────────
labels:
  - pairs:
      greenops.io/env: dev
    includeSelectors: false
    includeTemplates: true

# ── Patches ──────────────────────────────────────────────────────────────────
patches:
  - target:
      kind: Deployment
      name: greenops-demo-workload
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # 2. Resource limits — relaxed in dev to save cluster capacity.
  - target:
      kind: Deployment
      name: greenops-demo-workload
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"

  # 3. Config overrides — debug logging in dev.
  - target:
      kind: ConfigMap
      name: greenops-demo-workload-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: "DEBUG"
      - op: replace
        path: /data/LOG_FORMAT
        value: "pretty"

  # 4. Image pull policy — dev uses the mutable :dev tag, so always re-pull.
  - target:
      kind: Deployment
      name: greenops-demo-workload
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
