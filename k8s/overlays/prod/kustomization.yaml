# ======================================
# Kustomization — prod overlay


apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: greenops

resources:
  - ../../base

# ── Image overrides ───────────────────────────────────────────────────────────

images:
  - name: greenops-demo-workload
    newName: ghcr.io/kumardeepak9/greenops-demo-workload
    newTag: 0.1.0

# ── Common labels for this environment ───────────────────────────────────────

labels:
  - pairs:
      greenops.io/env: prod
    includeSelectors: false
    includeTemplates: true

# ── Patches ──────────────────────────────────────────────────────────────────
patches:
  # 1. Replica count
  - target:
      kind: Deployment
      name: greenops-demo-workload
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  # 2. Production resource envelope
  - target:
      kind: Deployment
      name: greenops-demo-workload
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"

  # 3. Production config
  - target:
      kind: ConfigMap
      name: greenops-demo-workload-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: "INFO"
      - op: replace
        path: /data/LOG_FORMAT
        value: "json"
      - op: replace
        path: /data/UVICORN_WORKERS
        value: "4"
