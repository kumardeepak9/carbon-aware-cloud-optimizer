# =========================
# Kustomization — base

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: greenops
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: greenops
    includeSelectors: false
    includeTemplates: true
