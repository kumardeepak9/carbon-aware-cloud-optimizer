[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "carbon-aware-cloud-optimizer"
version = "0.1.0"
description = "AI-driven, carbon-aware workload scheduler for Kubernetes clusters."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "GreenOps Team" }]

dependencies = [
    # Configuration & validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # HTTP client (Electricity Maps API)
    "httpx>=0.27",

    # Prometheus metrics
    "prometheus-client>=0.20",

    # Kubernetes SDK
    "kubernetes>=29.0",

    # Structured logging
    "structlog>=24.1",

    # Templating (GreenOps reports)
    "jinja2>=3.1",

    # Scheduling
    "apscheduler>=3.10",

    # CLI utilities
    "typer>=0.12",

    # Async support
    "anyio>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx",                   # also used as async test client
    "respx>=0.21",             # mock httpx requests in tests
    "mypy>=1.10",
    "ruff>=0.4",
    "pre-commit>=3.7",
]

[project.scripts]
greenops-agent = "agent.agent:main"
greenops-health = "agent.health_cli:main"
greenops-gitops = "gitops.cli:main"
greenops-report = "reporting.report:main"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=. --cov-report=term-missing -q"
log_cli = true
log_cli_level = "INFO"

[tool.coverage.run]
omit = ["tests/*", "scripts/*", "docs/*"]
