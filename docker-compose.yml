# =============================================================================
# Carbon-Aware Cloud Optimizer — Local Development Stack
# =============================================================================
# Spins up: demo workload, carbon exporter, Prometheus, Grafana, Pushgateway
#
# Port allocation:
#   8000 → Demo workload metrics (greenops_demo_*)
#   8002 → Carbon exporter metrics (greenops_carbon_*)
#   9090 → Prometheus
#   9091 → Pushgateway
#   3000 → Grafana
#
# Usage:
#   docker compose up -d                    # start full stack
#   docker compose logs -f carbon-exporter # stream carbon exporter logs
#   docker compose logs -f workload         # stream workload logs
#   docker compose down                     # stop
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # GreenOps Demo Workload
  # ---------------------------------------------------------------------------
  workload:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    environment:
      - APP_ENV=${APP_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    ports:
      - "8000:8080"    # Demo workload HTTP + metrics (greenops_demo_*)
    read_only: true
    tmpfs:
      - /tmp
      - /tmp/uvicorn
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - greenops

  # ---------------------------------------------------------------------------
  # GreenOps Carbon Exporter
  # ---------------------------------------------------------------------------
  # Fetches Electricity Maps data on a 60-second schedule and serves
  # greenops_carbon_* Prometheus metrics on port 8002.
  #
  # Runs as a separate service so it can be scaled, restarted, and monitored
  # independently of the AI agent.
  # ---------------------------------------------------------------------------
  carbon-exporter:
    build:
      context: .
      dockerfile: docker/carbon.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - ELECTRICITY_MAPS_ZONE=${ELECTRICITY_MAPS_ZONE:-DE}
      - AGENT_POLL_INTERVAL_SECONDS=${AGENT_POLL_INTERVAL_SECONDS:-60}
    ports:
      - "8002:8002"    # Carbon metrics scrape endpoint (greenops_carbon_*)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - greenops

  # ---------------------------------------------------------------------------
  # Prometheus
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
    ports:
      - "9090:9090"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - greenops

  # ---------------------------------------------------------------------------
  # Prometheus Pushgateway (for batch/agent metrics)
  # ---------------------------------------------------------------------------
  pushgateway:
    image: prom/pushgateway:v1.8.0
    ports:
      - "9091:9091"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - greenops

  # ---------------------------------------------------------------------------
  # Grafana
  # ---------------------------------------------------------------------------
  # Provisioning auto-loads:
  #   - Prometheus datasource (uid: prometheus, required for ${DS_PROMETHEUS} templates)
  #   - GreenOps AI dashboard from monitoring/dashboards/greenops_main.json
  # Set GRAFANA_ADMIN_PASSWORD in .env before starting Grafana.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.3
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env before starting Grafana}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/greenops_main.json
    volumes:
      - grafana_data:/var/lib/grafana
      # Provisioning: datasource config (creates Prometheus datasource automatically)
      - ./monitoring/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # Provisioning: dashboard provider config (tells Grafana where to find JSON files)
      - ./monitoring/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # Dashboard JSON files (watched by the provider above)
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - greenops


# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  prometheus_data:
  grafana_data:

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  greenops:
    driver: bridge
