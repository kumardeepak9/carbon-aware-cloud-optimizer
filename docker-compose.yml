# =========================================
# Carbon-Aware Cloud Optimizer — Local Development Stack
services:
  # ---------------------------------------
  # GreenOps Demo Workload

  workload:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    environment:
      - APP_ENV=${APP_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    ports:
      - "8000:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /tmp/uvicorn
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - greenops

  # --------------------------------------
  # GreenOps Carbon Exporter
  carbon-exporter:
    build:
      context: .
      dockerfile: docker/carbon.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - ELECTRICITY_MAPS_API_KEY=${ELECTRICITY_MAPS_API_KEY:?set ELECTRICITY_MAPS_API_KEY in .env}
      - ELECTRICITY_MAPS_ZONE=${ELECTRICITY_MAPS_ZONE:-DE}
      - AGENT_POLL_INTERVAL_SECONDS=${AGENT_POLL_INTERVAL_SECONDS:-60}
    ports:
      - "8002:8002"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - greenops

  # -----------------------------------------
  # Prometheus

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - greenops

  # --------------------------------------
  # Grafana
  grafana:
    image: grafana/grafana:10.4.3
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env before starting Grafana}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/greenops_main.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - greenops



# Volumes
volumes:
  prometheus_data:
  grafana_data:
# Networks
networks:
  greenops:
    driver: bridge
