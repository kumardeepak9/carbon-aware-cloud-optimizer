# ==========================================
# Prometheus — Scrape Configuration


global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

  external_labels:
    cluster: "greenops-local"
    env: "development"

# ---------------------------------------------------------------------------
# Alerting
# ---------------------------------------------------------------------------
alerting:
  alertmanagers:
    - static_configs:
        - targets: []   # Alertmanager not required for local dev


rule_files:
  - "rules/greenops_recording.yml"
  - "rules/greenops_alerts.yml"


scrape_configs:

  # ── 1. GreenOps demo workload: Docker Compose ───────────────────────────
  - job_name: "greenops-demo-workload"
    static_configs:
      - targets: ["workload:8080"]   # Docker Compose service name
    metrics_path: /metrics
    relabel_configs:
      - target_label: namespace
        replacement: greenops
      - target_label: deployment
        replacement: greenops-demo-workload

  # ── 2. GreenOps demo workload: kind ──────────────────────────────────────

  - job_name: "greenops-k8s-demo-workload"
    static_configs:
      - targets: ["host.docker.internal:18000"]
    metrics_path: /metrics
    relabel_configs:
      - target_label: namespace
        replacement: greenops-dev
      - target_label: deployment
        replacement: greenops-demo-workload

  # ── 3. kube-state-metrics ────────────────────────────────────────────────

  - job_name: "kube-state-metrics"
    static_configs:
      - targets: ["host.docker.internal:18080"]
    honor_labels: true

  # ── 4. node-exporter ─────────────────────────────────────────────────────

  - job_name: "node-exporter"
    static_configs:
      - targets: ["host.docker.internal:19100"]

  # ── 5. Prometheus self-scrape ─────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── 6. Carbon metrics exporter (Electricity Maps → Prometheus) ────────────

  - job_name: "greenops-carbon-exporter"
    static_configs:
      - targets: ["carbon-exporter:8002"]
    metrics_path: /metrics
    scrape_interval: 60s
    scrape_timeout: 15s
    relabel_configs:
      - target_label: component
        replacement: carbon-exporter
