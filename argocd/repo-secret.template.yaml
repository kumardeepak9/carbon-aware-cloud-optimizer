apiVersion: v1
kind: Secret
metadata:
  name: greenops-repo-secret
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    greenops.io/description: >
      Repository credentials for the GreenOps GitOps source repository.
      The token value MUST be supplied via a secrets manager (e.g. Sealed Secrets,
      External Secrets Operator, or Vault) — never committed as a plain value.
      This file is a template; replace <BASE64_GITHUB_TOKEN> before applying.
type: Opaque
stringData:
  # ── Required fields ────────────────────────────────────────────────────────
  # These fields are interpreted by the Argo CD repo-server.
  type: git
  url: https://github.com/kumardeepak9/carbon-aware-cloud-optimizer.git

  # ── Authentication ────────────────────────────────────────────────────────
  # Use a fine-grained GitHub Personal Access Token with:
  #   - Contents: Read-only  (Argo CD only reads the desired state)
  #   - Metadata: Read-only  (required by GitHub)
  #
  # The GreenOps GitOps workflow uses a SEPARATE token with write access
  # (set via GREENOPS_GITOPS_GITHUB_TOKEN) so that Argo CD read credentials
  # and workflow write credentials are never the same secret.
  #
  # Replace the placeholder below via:
  #   kubectl create secret generic greenops-repo-secret \
  #     -n argocd \
  #     --from-literal=password=<your-token> \
  #     --dry-run=client -o yaml | kubeseal > argocd/sealed-repo-secret.yaml
  username: git
  password: REPLACE_WITH_SEALED_SECRET_OR_ESO_VALUE  # never commit a real token here
