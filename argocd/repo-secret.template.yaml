apiVersion: v1
kind: Secret
metadata:
  name: greenops-repo-secret
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    greenops.io/description: >
      Repository credentials for the GreenOps GitOps source repository.
      This file is a TEMPLATE and is excluded from Argo CD sync
      (app-of-apps manages only project.yaml + applications/*.yaml).
      The real token MUST be supplied via a secrets manager (Sealed Secrets,
      External Secrets Operator, or Vault) — never committed. `stringData`
      takes the raw token (Argo CD base64-encodes it into `data` on apply).
type: Opaque
stringData:
  # ── Required fields ────────────────────────────────────────────────────────
  type: git
  url: https://github.com/kumardeepak9/carbon-aware-cloud-optimizer.git

  username: git
  password: REPLACE_WITH_SEALED_SECRET_OR_ESO_VALUE