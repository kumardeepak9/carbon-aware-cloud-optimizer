apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: greenops-workload-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    greenops.io/env: dev
    greenops.io/tier: workload
  annotations:
    greenops.io/managed-by: "greenops-ai"
    greenops.io/description: >
      Development environment workload for the GreenOps AI demo.
      Replica count is managed by the GreenOps AI GitOps workflow.
      The AI agent commits changes to k8s/overlays/dev/kustomization.yaml
      which Argo CD then syncs to the cluster.
spec:
  # ── Project scope ─────────────────────────────────────────────────────────
  project: greenops

  # ── Source ────────────────────────────────────────────────────────────────
  source:
    repoURL: https://github.com/kumardeepak9/carbon-aware-cloud-optimizer.git
    targetRevision: main
    path: k8s/overlays/dev
    kustomize:
      
      {}

  # ── Destination ───────────────────────────────────────────────────────────
  destination:
    server: https://kubernetes.default.svc
    namespace: greenops-dev

  syncPolicy:
    syncOptions:
      - CreateNamespace=true       # Create the greenops namespace if absent
      - PrunePropagationPolicy=foreground
      - PruneLast=true             # Delete old resources only after new ones are ready

 